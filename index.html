<script>
(function () {
  var KUNCI = 'lib_supabase_v2';
  var SUMBER = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://gcore.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  var banner = null;
  function tampilBanner(teks, tombol, aksi) {
    if (!banner) {
      banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;background:#F5C542;color:#0B2A4A;font:800 0.85rem Trebuchet MS,sans-serif;padding:9px 16px;border-radius:999px;border:2px solid #7A5A12;box-shadow:0 6px 16px rgba(0,0,0,.4);text-align:center;max-width:90vw;';
      document.body.appendChild(banner);
    }
    banner.textContent = teks + ' ';
    if (tombol) {
      var b = document.createElement('button');
      b.textContent = tombol;
      b.style.cssText = 'margin-left:6px;padding:4px 10px;border-radius:999px;border:2px solid #0B2A4A;background:#fff;color:#0B2A4A;font:800 0.8rem Trebuchet MS,sans-serif;cursor:pointer;';
      b.onclick = aksi;
      banner.appendChild(b);
    }
  }
  function hapusBanner() { if (banner && banner.parentNode) banner.parentNode.removeChild(banner); banner = null; }
  function libSiap() { return !!(window.supabase && typeof window.supabase.createClient === 'function'); }
  function jalankanKode(kode) {
    var s = document.createElement('script');
    s.text = kode;
    document.head.appendChild(s);
    return libSiap();
  }
  function ambil(url, ms) {
    return new Promise(function (ok, gagal) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var t = setTimeout(function () { if (ctrl) ctrl.abort(); gagal(new Error('waktu habis')); }, ms);
      fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'force-cache' })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
        .then(function (txt) { clearTimeout(t); ok(txt); }, function (e) { clearTimeout(t); gagal(e); });
    });
  }
  function siapkanLib() {
    try {
      var simpan = localStorage.getItem(KUNCI);
      if (simpan) { if (jalankanKode(simpan)) return Promise.resolve(); localStorage.removeItem(KUNCI); }
    } catch (e) {}
    var i = 0;
    function coba() {
      if (i >= SUMBER.length) return Promise.reject(new Error('semua sumber gagal'));
      var url = SUMBER[i++];
      return ambil(url, 9000).then(function (txt) {
        if (txt.length < 50000 || txt.indexOf('createClient') < 0) throw new Error('isi tidak valid');
        if (!jalankanKode(txt)) throw new Error('library tidak aktif');
        try { localStorage.setItem(KUNCI, txt); } catch (e) {}
      }).catch(function () { return coba(); });
    }
    return coba();
  }
  window.mulaiAplikasi = function () {
    var el = document.getElementById('kode-app');
    function jalan() { var s = document.createElement('script'); s.text = el.textContent; document.head.appendChild(s); hapusBanner(); }
    if (libSiap()) { jalan(); return; }
    tampilBanner('Menyiapkan aplikasi...');
    siapkanLib().then(jalan, function () {
      tampilBanner('Koneksi lambat atau terputus.', 'Coba Lagi', function () { window.mulaiAplikasi(); });
    });
  };
})();
</script>

// Tab switching
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const tab = btn.dataset.tab;
  document.getElementById('panel-daftar').classList.toggle('active', tab === 'daftar');
  document.getElementById('panel-masuk').classList.toggle('active', tab === 'masuk');
});

function togglePw(id, btn) {
  const el = document.getElementById(id);
  if (el.type === 'password') {
    el.type = 'text';
    btn.textContent = 'Sembunyi';
  } else {
    el.type = 'password';
    btn.textContent = 'Lihat';
  }
}

function showMsg(id, text, kind) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show ' + kind;
}

// Muat daftar kelas untuk dropdown
let kelasList = [];
async function muatKelas() {
  const sel = document.getElementById('d-kelas');
  try {
    const { data, error } = await sb.from('kelas').select('*').order('tingkat', { ascending: true });
    if (error) throw error;
    kelasList = data || [];
    if (kelasList.length === 0) {
      sel.innerHTML = '<option value="">Belum ada data kelas</option>';
      return;
    }
    sel.innerHTML = kelasList.map(k => `<option value="${k.id}">${k.nama_kelas}</option>`).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">Gagal memuat kelas</option>';
  }
}
muatKelas();

// DAFTAR
async function daftar() {
  const nama = document.getElementById('d-nama').value.trim();
  const email = document.getElementById('d-email').value.trim();
  const pass = document.getElementById('d-pass').value;
  const pass2 = document.getElementById('d-pass2').value;
  const idKelas = document.getElementById('d-kelas').value;
  const btn = document.getElementById('btn-daftar');

  if (!nama || !email || !pass || !pass2 || !idKelas) {
    showMsg('msg-daftar', 'Semua kolom wajib diisi, termasuk pilih kelas.', 'err');
    return;
  }
  if (pass.length < 6) {
    showMsg('msg-daftar', 'Password minimal 6 karakter.', 'err');
    return;
  }
  if (pass !== pass2) {
    showMsg('msg-daftar', 'Konfirmasi password tidak sama.', 'err');
    return;
  }

  btn.setAttribute('disabled', 'true');
  btn.textContent = 'Memproses...';

  try {
    const { data, error } = await sb.auth.signUp({ email, password: pass });
    if (error) {
      if (error.message.toLowerCase().includes('already') || error.message.toLowerCase().includes('registered')) {
        throw new Error('Email ini sudah terdaftar. Silakan masuk lewat tab "Masuk".');
      }
      throw error;
    }
    const uid = data.user && data.user.id;
    if (!uid) throw new Error('Pendaftaran gagal, coba lagi.');

    const { error: errProfil } = await sb.from('profil').insert({
      id: uid,
      nama: nama,
      email: email,
      id_kelas: idKelas
    });
    if (errProfil) {
      if (errProfil.message.toLowerCase().includes('duplicate')) {
        throw new Error('Email ini sudah terdaftar sebelumnya.');
      }
      throw errProfil;
    }

    showMsg('msg-daftar', 'Akun berhasil dibuat! Menunggu persetujuan admin sebelum bisa dipakai. Silakan pindah ke tab "Masuk".', 'ok');
    document.getElementById('d-nama').value = '';
    document.getElementById('d-email').value = '';
    document.getElementById('d-pass').value = '';
    document.getElementById('d-pass2').value = '';
  } catch (e) {
    showMsg('msg-daftar', e.message || 'Terjadi kesalahan.', 'err');
  } finally {
    btn.removeAttribute('disabled');
    btn.textContent = 'Daftar Akun';
  }
}

// MASUK
async function masuk() {
  const email = document.getElementById('m-email').value.trim();
  const pass = document.getElementById('m-pass').value;
  const btn = document.getElementById('btn-masuk');

  if (!email || !pass) {
    showMsg('msg-masuk', 'Email dan password wajib diisi.', 'err');
    return;
  }

  btn.setAttribute('disabled', 'true');
  btn.textContent = 'Memproses...';
  document.getElementById('area-welcome').style.display = 'none';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw new Error('Email atau password salah.');

    const uid = data.user.id;
    const { data: profilData, error: errProfil } = await sb.from('profil').select('*').eq('id', uid).single();
    if (errProfil) throw new Error('Profil tidak ditemukan. Hubungi admin.');

    document.getElementById('msg-masuk').classList.remove('show');
    document.getElementById('area-welcome').style.display = 'block';
    document.getElementById('w-nama').textContent = profilData.nama;
    document.getElementById('w-role').textContent = profilData.role === 'admin' ? 'ADMIN' : 'SISWA';

    const statusEl = document.getElementById('w-status-msg');
    const btnLanjut = document.getElementById('btn-lanjut');
    if (profilData.status === 'approved') {
      statusEl.innerHTML = '<p style="color:var(--green);font-weight:700;margin-bottom:6px;">Akun aktif ✓</p>';
      btnLanjut.style.display = 'block';
    } else if (profilData.status === 'pending') {
      statusEl.innerHTML = '<p style="color:#7A5A12;font-weight:700;margin-bottom:6px;">Menunggu persetujuan admin</p>';
      btnLanjut.style.display = 'none';
    } else {
      statusEl.innerHTML = '<p style="color:var(--red);font-weight:700;margin-bottom:6px;">Pendaftaran ditolak admin</p>';
      btnLanjut.style.display = 'none';
    }

    if (profilData.role === 'admin') {
      document.getElementById('admin-section').style.display = 'block';
      muatAdminPanel();
    }
  } catch (e) {
    showMsg('msg-masuk', e.message || 'Terjadi kesalahan.', 'err');
  } finally {
    btn.removeAttribute('disabled');
    btn.textContent = 'Masuk';
  }
}

// PANEL ADMIN
async function muatAdminPanel() {
  const pendingEl = document.getElementById('list-pending');
  const approvedEl = document.getElementById('list-approved');
  try {
    const { data, error } = await sb.from('profil').select('*, kelas(nama_kelas)').order('dibuat_pada', { ascending: false });
    if (error) throw error;

    const pending = data.filter(p => p.status === 'pending' && p.role !== 'admin');
    const approved = data.filter(p => p.status === 'approved' && p.role !== 'admin');

    const buatOpsiKelas = (idKelasSekarang) => kelasList.map(k =>
      `<option value="${k.id}" ${k.id === idKelasSekarang ? 'selected' : ''}>${k.nama_kelas}</option>`
    ).join('');

    pendingEl.innerHTML = pending.length === 0
      ? '<span class="empty-note">Tidak ada akun menunggu.</span>'
      : pending.map(p => `
        <div class="user-row">
          <div class="top-line">
            <div class="info"><b>${p.nama}</b>${p.email} &middot; ${p.kelas ? p.kelas.nama_kelas : '-'}</div>
            <div class="actions">
              <button class="mini-btn approve" onclick="ubahStatus('${p.id}','approved')">Setujui</button>
              <button class="mini-btn reject" onclick="ubahStatus('${p.id}','ditolak')">Tolak</button>
            </div>
          </div>
          <div class="kelas-row">
            <select class="mini-select" id="kelas-sel-${p.id}">${buatOpsiKelas(p.id_kelas)}</select>
            <button class="mini-btn kick" onclick="ubahKelasUser('${p.id}')">Ubah Kelas</button>
          </div>
        </div>`).join('');

    approvedEl.innerHTML = approved.length === 0
      ? '<span class="empty-note">Belum ada akun aktif.</span>'
      : approved.map(p => `
        <div class="user-row">
          <div class="top-line">
            <div class="info"><b>${p.nama}</b>${p.email} &middot; ${p.kelas ? p.kelas.nama_kelas : '-'}</div>
            <div class="actions">
              <button class="mini-btn kick" onclick="ubahStatus('${p.id}','pending')">Cabut Akses</button>
            </div>
          </div>
          <div class="kelas-row">
            <select class="mini-select" id="kelas-sel-${p.id}">${buatOpsiKelas(p.id_kelas)}</select>
            <button class="mini-btn kick" onclick="ubahKelasUser('${p.id}')">Ubah Kelas</button>
          </div>
        </div>`).join('');
  } catch (e) {
    pendingEl.innerHTML = '<span class="empty-note">Gagal memuat: ' + (e.message || e) + '</span>';
    approvedEl.innerHTML = '';
  }
}

async function ubahKelasUser(id) {
  const sel = document.getElementById('kelas-sel-' + id);
  const idKelasBaru = sel.value;
  try {
    const { error } = await sb.from('profil').update({ id_kelas: idKelasBaru }).eq('id', id);
    if (error) throw error;
    muatAdminPanel();
  } catch (e) {
    alert('Gagal mengubah kelas: ' + (e.message || e));
  }
}

async function ubahStatus(id, status) {
  try {
    const { error } = await sb.from('profil').update({ status }).eq('id', id);
    if (error) throw error;
    muatAdminPanel();
  } catch (e) {
    alert('Gagal mengubah status: ' + (e.message || e));
  }
}
</script>
