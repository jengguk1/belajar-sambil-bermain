    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: #0B2A4A;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .overlay-dim {
    position: fixed;
    inset: 0;
    background: rgba(6,26,46,0.45);
  }
  .card {
    position: relative;
    z-index: 2;
    width: min(560px, 92vw);
    max-height: 88vh;
    overflow-y: auto;
    background: linear-gradient(180deg, var(--cream) 0%, #FBEFC9 100%);
    border: 4px solid var(--gold-dark);
    border-radius: 22px;
    padding: 22px 22px 26px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.45);
  }
  .tag {
    display: inline-block;
    background: var(--navy);
    color: var(--cream);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .question {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    all: unset;
    box-sizing: border-box;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    width: 100%;
    padding: 12px 14px;
    background: white;
    border: 2.5px solid #DCC98A;
    border-radius: 14px;
    font-size: 1.02rem;
    color: var(--navy);
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .opt:active { transform: scale(0.98); }
  .opt .letter {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--navy);
    color: var(--cream);
    font-weight: 800;
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
  }
  .opt.correct { background: #E4F7EA; border-color: var(--green); }
  .opt.correct .letter { background: var(--green); }
  .opt.wrong { background: #FBE7E7; border-color: var(--red); }
  .opt.wrong .letter { background: var(--red); }
  .opt.disabled { pointer-events: none; opacity: 0.85; }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }
  .score {
    font-weight: 800;
    color: var(--navy);
  }
  .btn-next {
    all: unset;
    box-sizing: border-box;
    padding: 10px 20px;
    font-weight: 800;
    color: var(--navy);
    background: linear-gradient(180deg, #FFE28A 0%, var(--gold) 55%, var(--gold-dark) 100%);
    border-radius: 999px;
    border: 2.5px solid #7A5A12;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .btn-next.show { opacity: 1; pointer-events: auto; }
  .state-msg {
    color: var(--navy);
    font-weight: 700;
    text-align: center;
    padding: 30px 10px;
  }
  .final {
    text-align: center;
  }
  .final .big {
    font-size: 2.4rem;
    font-weight: 900;
    color: var(--navy);
    margin: 6px 0;
  }
</style>
</head>
<body>
  <div style="position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:3; padding:12px 16px; display:flex;">
    <button id="btn-kembali-kuis" style="all:unset; color:white; font-weight:800; cursor:pointer; text-shadow:0 1px 3px rgba(0,0,0,0.6);">&larr; Kembali</button>
  </div>
  <div class="stage">
    <div class="overlay-dim"></div>
    <div class="card" id="card">
      <div class="state-msg">Memuat soal...</div>
    </div>
  </div>

<script type="text/plain" id="kode-app">
const SUPABASE_URL = "https://dyxmilgvaymkbzgjtvln.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eG1pbGd2YXlta2J6Z2p0dmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDI0NTAsImV4cCI6MjEwNTQxODQ1MH0.FbzeXaVS2WIhbd1U3RMoqvYxieD-_x-o7PYmS4zmrcE";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const card = document.getElementById('card');

let soalList = [];
let idx = 0;
let score = 0;
let answered = false;
let mapelSaatIni = null;

// ---------- Generator soal Matematika (prosedural, skala kelas 1-6) ----------
function acakInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function skalaKelasMtk(k) {
  if (k <= 2) return { tambahMax: 20, kaliMax: 5, besar: 90, uangSatuan: 100 };
  if (k <= 4) return { tambahMax: 50, kaliMax: 9, besar: 300, uangSatuan: 500 };
  return { tambahMax: 200, kaliMax: 12, besar: 900, uangSatuan: 1000 };
}
function buatOpsiMtk(jawaban, rentang) {
  let set = new Set([jawaban]); let p = 0;
  while (set.size < 4 && p < 30) { p++; const d = acakInt(-rentang, rentang); const kand = jawaban + (d === 0 ? 1 : d); if (kand >= 0) set.add(kand); }
  return shuffle([...set]).map(String);
}
function buatSoalMtk(kelas) {
  const sk = skalaKelasMtk(kelas);
  const bank = [
    () => { const a = acakInt(Math.round(sk.tambahMax*0.3),sk.tambahMax), b = acakInt(Math.round(sk.tambahMax*0.3),sk.tambahMax); return { p: `${a} + ${b} = ...`, j: a+b, rentang: Math.max(5,Math.round(sk.tambahMax*0.2)) }; },
    () => { const a = acakInt(Math.round(sk.tambahMax*0.6),sk.tambahMax*2), b = acakInt(1,a); return { p: `${a} - ${b} = ...`, j: a-b, rentang: Math.max(5,Math.round(sk.tambahMax*0.2)) }; },
    () => { const a = acakInt(2,sk.kaliMax), b = acakInt(2,sk.kaliMax); return { p: `${a} x ${b} = ...`, j: a*b, rentang: 10 }; },
    () => { const b = acakInt(2,sk.kaliMax), h = acakInt(2,sk.kaliMax); return { p: `${b*h} : ${b} = ...`, j: h, rentang: 5 }; },
    () => { const n = acakInt(1,9); return { p: `${n} km = ... m`, j: n*1000, rentang: 500 }; },
    () => { const n = acakInt(1,9); return { p: `${n} kg = ... gram`, j: n*1000, rentang: 500 }; },
    () => { const rak = acakInt(3,sk.kaliMax), isi = acakInt(5,sk.kaliMax+3), pinjam = acakInt(5, Math.max(6,rak*isi-10));
      return { p: `Ada ${rak} rak buku, tiap rak berisi ${isi} buku. Jika ${pinjam} buku dipinjam, sisa berapa buku?`, j: rak*isi-pinjam, rentang: 10 }; },
    () => { const harga = acakInt(5,20)*sk.uangSatuan/10, beli = acakInt(2,6), bayar = (harga*beli) + acakInt(1,5)*sk.uangSatuan;
      return { p: `Satu buku harganya Rp${harga}. Budi membeli ${beli} buku dan membayar Rp${bayar}. Berapa rupiah uang kembaliannya?`, j: bayar - (harga*beli), rentang: Math.max(10,Math.round((bayar-(harga*beli))*0.1)) }; },
  ];
  const t = bank[acakInt(0, bank.length - 1)]();
  const opsi = buatOpsiMtk(t.j, t.rentang);
  const huruf = ['A','B','C','D'];
  const idxBenar = opsi.indexOf(String(t.j));
  return {
    kategori: 'Matematika', tingkat: kelas, pertanyaan: t.p,
    pilihan_a: opsi[0], pilihan_b: opsi[1], pilihan_c: opsi[2], pilihan_d: opsi[3],
    jawaban_benar: huruf[idxBenar]
  };
}
function buatSetSoalMtk(kelas, jumlah) {
  const hasil = [];
  for (let i = 0; i < jumlah; i++) hasil.push(buatSoalMtk(kelas));
  return hasil;
}

async function muat() {
  const params = new URLSearchParams(window.location.search);
  const mapel = params.get('mapel');
  mapelSaatIni = mapel;
  if (!mapel) { window.location.href = 'beranda.html'; return; }
  document.getElementById('btn-kembali-kuis').onclick = () => window.location.href = 'mapel.html?mapel=' + mapel;

  try {
    const { data: sesi } = await sb.auth.getSession();
    if (!sesi.session) { window.location.href = 'index.html'; return; }
    const uid = sesi.session.user.id;

    const { data: p, error: errProfil } = await sb.from('profil').select('*, kelas(tingkat)').eq('id', uid).single();
    if (errProfil) throw errProfil;
    if (p.status !== 'approved' && p.role !== 'admin') {
      card.innerHTML = '<div class="state-msg">Akun belum disetujui admin.</div>';
      return;
    }
    let tingkat = p.kelas ? p.kelas.tingkat : null;
    const kelasParam = params.get('kelas');
    if (p.role === 'admin' && kelasParam) tingkat = parseInt(kelasParam, 10);
    if (!tingkat) {
      card.innerHTML = '<div class="state-msg">Kelas kamu belum diatur. Hubungi admin.</div>';
      return;
    }

    if (mapel === 'matematika') {
      soalList = buatSetSoalMtk(tingkat, 10);
      tampilkanSoal();
      return;
    }

    const { data, error } = await sb.from('soal').select('*').eq('mapel', mapel).eq('tingkat', tingkat).limit(15);
    if (error) throw error;
    if (!data || data.length === 0) {
      card.innerHTML = '<div class="state-msg">Belum ada soal untuk mapel ini di kelasmu.<br>Coba mapel lain dulu, ya.</div>';
      return;
    }
    soalList = data.sort(() => Math.random() - 0.5);
    tampilkanSoal();
  } catch (e) {
    card.innerHTML = '<div class="state-msg">Gagal memuat soal.<br>' + (e.message || e) + '</div>';
  }
}

function tampilkanSoal() {
  answered = false;
  const s = soalList[idx];
  const pilihan = [
    { huruf: 'A', teks: s.pilihan_a },
    { huruf: 'B', teks: s.pilihan_b },
    { huruf: 'C', teks: s.pilihan_c },
    { huruf: 'D', teks: s.pilihan_d }
  ];

  card.innerHTML = `
    <span class="tag">${s.kategori || 'Soal'} &middot; Tingkat ${s.tingkat ?? '-'}</span>
    <div class="question">${idx + 1}. ${s.pertanyaan}</div>
    <div class="options" id="opts"></div>
    <div class="footer-row">
      <div class="score">Skor: ${score} / ${idx}</div>
      <button class="btn-next" id="btnNext">${idx + 1 < soalList.length ? 'Lanjut →' : 'Lihat Hasil →'}</button>
    </div>
  `;

  const opts = document.getElementById('opts');
  pilihan.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${p.huruf}</span><span>${p.teks}</span>`;
    btn.onclick = () => pilihJawaban(p.huruf, btn, s);
    opts.appendChild(btn);
  });

  document.getElementById('btnNext').onclick = lanjut;
}

async function pilihJawaban(huruf, btnEl, soal) {
  if (answered) return;
  answered = true;
  const benar = huruf === soal.jawaban_benar;
  if (benar) score++;

  document.querySelectorAll('.opt').forEach(o => o.classList.add('disabled'));
  btnEl.classList.add(benar ? 'correct' : 'wrong');
  if (!benar) {
    document.querySelectorAll('.opt').forEach(o => {
      if (o.textContent.trim().startsWith(soal.jawaban_benar)) o.classList.add('correct');
    });
  }

  document.querySelector('.score').textContent = `Skor: ${score} / ${idx + 1}`;
  document.getElementById('btnNext').classList.add('show');

  try {
    await sb.from('skor').insert({
      id_siswa: null,
      id_soal: soal.id,
      jawaban_dipilih: huruf,
      benar: benar
    });
  } catch (e) {
    console.warn('Gagal simpan skor:', e.message || e);
  }
}

function lanjut() {
  idx++;
  if (idx < soalList.length) {
    tampilkanSoal();
  } else {
    tampilkanHasil();
  }
}

function tampilkanHasil() {
  card.innerHTML = `
    <div class="final">
      <div class="tag">Selesai!</div>
      <div class="big">${score} / ${soalList.length}</div>
      <p style="color:var(--navy); font-weight:600; margin-bottom:16px;">Jawaban benar kamu</p>
      <button class="btn-next show" id="btnUlang">Ulangi Kuis →</button>
      <button class="btn-next show" id="btnKembaliMapel" style="margin-top:10px; background:var(--navy); color:white;">Kembali ke Mapel</button>
    </div>
  `;
  document.getElementById('btnUlang').onclick = () => {
    idx = 0; score = 0;
    tampilkanSoal();
  };
  document.getElementById('btnKembaliMapel').onclick = () => window.location.href = 'mapel.html?mapel=' + mapelSaatIni;
}

muat();
</script>
<script>mulaiAplikasi();</script>
</body>
</html>
