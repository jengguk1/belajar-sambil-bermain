<script>
(function () {
  var KUNCI = 'lib_supabase_v2';
  var SUMBER = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://gcore.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  var banner = null;
  function tampilBanner(teks, tombol, aksi) {
    if (!banner) {
      banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;background:#F5C542;color:#0B2A4A;font:800 0.85rem Trebuchet MS,sans-serif;padding:9px 16px;border-radius:999px;border:2px solid #7A5A12;box-shadow:0 6px 16px rgba(0,0,0,.4);text-align:center;max-width:90vw;';
      document.body.appendChild(banner);
    }
    banner.textContent = teks + ' ';
    if (tombol) {
      var b = document.createElement('button');
      b.textContent = tombol;
      b.style.cssText = 'margin-left:6px;padding:4px 10px;border-radius:999px;border:2px solid #0B2A4A;background:#fff;color:#0B2A4A;font:800 0.8rem Trebuchet MS,sans-serif;cursor:pointer;';
      b.onclick = aksi;
      banner.appendChild(b);
    }
  }
  function hapusBanner() { if (banner && banner.parentNode) banner.parentNode.removeChild(banner); banner = null; }
  function libSiap() { return !!(window.supabase && typeof window.supabase.createClient === 'function'); }
  function jalankanKode(kode) {
    var s = document.createElement('script');
    s.text = kode;
    document.head.appendChild(s);
    return libSiap();
  }
  function ambil(url, ms) {
    return new Promise(function (ok, gagal) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var t = setTimeout(function () { if (ctrl) ctrl.abort(); gagal(new Error('waktu habis')); }, ms);
      fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'force-cache' })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
        .then(function (txt) { clearTimeout(t); ok(txt); }, function (e) { clearTimeout(t); gagal(e); });
    });
  }
  function siapkanLib() {
    try {
      var simpan = localStorage.getItem(KUNCI);
      if (simpan) { if (jalankanKode(simpan)) return Promise.resolve(); localStorage.removeItem(KUNCI); }
    } catch (e) {}
    var i = 0;
    function coba() {
      if (i >= SUMBER.length) return Promise.reject(new Error('semua sumber gagal'));
      var url = SUMBER[i++];
      return ambil(url, 9000).then(function (txt) {
        if (txt.length < 50000 || txt.indexOf('createClient') < 0) throw new Error('isi tidak valid');
        if (!jalankanKode(txt)) throw new Error('library tidak aktif');
        try { localStorage.setItem(KUNCI, txt); } catch (e) {}
      }).catch(function () { return coba(); });
    }
    return coba();
  }
  window.mulaiAplikasi = function () {
    var el = document.getElementById('kode-app');
    function jalan() { var s = document.createElement('script'); s.text = el.textContent; document.head.appendChild(s); hapusBanner(); }
    if (libSiap()) { jalan(); return; }
    tampilBanner('Menyiapkan aplikasi...');
    siapkanLib().then(jalan, function () {
      tampilBanner('Koneksi lambat atau terputus.', 'Coba Lagi', function () { window.mulaiAplikasi(); });
    });
  };
})();
</script>

  .win-overlay {

  .btn-main {
    all: unset; box-sizing: border-box; display: block; width: 100%; text-align: center; padding: 12px;
    font-weight: 800; color: var(--navy);
    background: linear-gradient(180deg, #FFE28A 0%, var(--gold) 55%, var(--gold-dark) 100%);
    border-radius: 999px; border: 2.5px solid #7A5A12; cursor: pointer; margin-top: 8px;

    border-radius: 999px; border: 2.5px solid #06162a; cursor: pointer; margin-top: 8px;

  @keyframes goyangKartu { 0%,100%{transform:rotateY(180deg) translateX(0);} 25%{transform:rotateY(180deg) translateX(-5px);} 75%{transform:rotateY(180deg) translateX(5px);} }
  .card.salah-sekejap .card-inner { animation: goyangKartu 0.3s; }
  @keyframes munculCocok { 0%{transform:rotateY(180deg) scale(1);} 40%{transform:rotateY(180deg) scale(1.12);} 100%{transform:rotateY(180deg) scale(1);} }
  .card.matched .card-inner { animation: munculCocok 0.35s; }

  <div class="topbar">

<script type="text/plain" id="kode-app">
const SUPABASE_URL = "https://dyxmilgvaymkbzgjtvln.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eG1pbGd2YXlta2J6Z2p0dmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDI0NTAsImV4cCI6MjEwNTQxODQ1MH0.FbzeXaVS2WIhbd1U3RMoqvYxieD-_x-o7PYmS4zmrcE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NAMA_MAPEL = {
  matematika: 'Matematika',
  bahasa_indonesia: 'Bahasa Indonesia',
  ipas: 'IPAS',
  pendidikan_pancasila: 'Pendidikan Pancasila'
};

let deck = [];
let flipped = [];
let matched = 0;
let totalPasangan = 0;
let uidSaya = null;
let namaSaya = 'Siswa';
let tingkatSaya = null;
let mapelSaya = null;
let langkah = 0;
let waktuDetik = 0;
let timerInterval = null;
let mengunci = false;

function acak(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatWaktu(detik) {
  const m = Math.floor(detik / 60).toString().padStart(2, '0');
  const s = (detik % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function mulaiTimer() {
  clearInterval(timerInterval);
  waktuDetik = 0;
  document.getElementById('stat-waktu').textContent = '00:00';
  timerInterval = setInterval(() => {
    waktuDetik++;
    document.getElementById('stat-waktu').textContent = formatWaktu(waktuDetik);
  }, 1000);
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const mapel = params.get('mapel');
  if (!mapel || !NAMA_MAPEL[mapel]) {
    window.location.href = 'pilih-mapel.html';
    return;
  }
  document.getElementById('judul-mapel').textContent = NAMA_MAPEL[mapel];

  const { data: sesi } = await sb.auth.getSession();
  if (!sesi.session) {
    window.location.href = 'index.html';
    return;
  }
  const uid = sesi.session.user.id;
  uidSaya = uid;
  mapelSaya = mapel;

  try {
    const { data: profilData, error: errProfil } = await sb.from('profil').select('*, kelas(nama_kelas, tingkat)').eq('id', uid).single();
    if (errProfil) throw errProfil;
    if (profilData.status !== 'approved' && profilData.role !== 'admin') {
      document.getElementById('info-kelas').textContent = 'Akun belum disetujui admin.';
      return;
    }
    namaSaya = profilData.nama || 'Siswa';
    const tingkat = profilData.kelas ? profilData.kelas.tingkat : null;
    tingkatSaya = tingkat;
    document.getElementById('info-kelas').textContent = profilData.kelas ? profilData.kelas.nama_kelas : '';

    if (!tingkat) {
      tampilkanPesan('Kelas belum diatur. Hubungi admin.');
      return;
    }

    const { data: kartuData, error: errKartu } = await sb.from('kartu_pasangan').select('*').eq('mapel', mapel).eq('tingkat', tingkat);
    if (errKartu) throw errKartu;

    if (!kartuData || kartuData.length === 0) {
      tampilkanPesan('Belum ada kartu untuk ' + NAMA_MAPEL[mapel] + ' di kelas ini.');
      return;
    }

    window.__pasanganData = kartuData;
    buatPapan(kartuData);
  } catch (e) {
    tampilkanPesan('Gagal memuat data: ' + (e.message || e));
  }
}

function tampilkanPesan(teks) {
  document.getElementById('board').style.display = 'none';
  const msg = document.getElementById('center-msg');
  msg.textContent = teks;
  msg.style.display = 'block';
}

function buatPapan(kartuData) {
  document.getElementById('board').style.display = 'grid';
  document.getElementById('center-msg').style.display = 'none';

  let cards = [];
  kartuData.forEach(row => {
    cards.push({ pairId: row.id, teks: row.sisi_a });
    cards.push({ pairId: row.id, teks: row.sisi_b });
  });
  deck = acak(cards);
  totalPasangan = kartuData.length;

  flipped = [];
  matched = 0;
  langkah = 0;
  mengunci = false;
  document.getElementById('stat-langkah').textContent = '0';
  document.getElementById('stat-pasangan').textContent = '0/' + totalPasangan;
  document.getElementById('win-overlay').classList.remove('show');

  const board = document.getElementById('board');
  board.innerHTML = '';
  deck.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.pairid = item.pairId;
    const kelasGambar = item.teks.trim().length <= 4 ? ' gambar' : '';
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front">?</div>
        <div class="card-face card-back${kelasGambar}">${item.teks}</div>
      </div>`;
    card.addEventListener('click', () => balikKartu(card));
    board.appendChild(card);
  });

  mulaiTimer();
}


function bacaPengaturan() {
  try { return JSON.parse(localStorage.getItem('pengaturan_game') || '{"musik":true,"efek":true}'); }
  catch (e) { return { musik: true, efek: true }; }
}
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function nada(freq, durasi, tipe, waktuMulai) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tipe || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, ctx.currentTime + waktuMulai);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + waktuMulai + durasi);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + waktuMulai);
    osc.stop(ctx.currentTime + waktuMulai + durasi);
  } catch (e) {}
}
function bunyiKlik() { if (bacaPengaturan().efek) nada(600, 0.06, 'square', 0); }
function bunyiCocok() {
  if (!bacaPengaturan().efek) return;
  nada(659, 0.1, 'sine', 0); nada(880, 0.16, 'sine', 0.1);
}
function bunyiSalah() { if (bacaPengaturan().efek) nada(200, 0.2, 'sawtooth', 0); }
function bunyiSelesai() {
  if (!bacaPengaturan().efek) return;
  nada(523,0.1,'sine',0); nada(659,0.1,'sine',0.1); nada(784,0.1,'sine',0.2); nada(1047,0.25,'sine',0.3);
}

function balikKartu(card) {
  if (mengunci) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flipped.length === 2) return;

  bunyiKlik();
  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    langkah++;
    document.getElementById('stat-langkah').textContent = langkah;
    const [a, b] = flipped;
    if (a.dataset.pairid === b.dataset.pairid) {
      bunyiCocok();
      a.classList.add('matched');
      b.classList.add('matched');
      matched++;
      document.getElementById('stat-pasangan').textContent = matched + '/' + totalPasangan;
      flipped = [];
      if (matched === totalPasangan) selesai();
    } else {
      bunyiSalah();
      a.classList.add('salah-sekejap');
      b.classList.add('salah-sekejap');
      mengunci = true;
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        a.classList.remove('salah-sekejap');
        b.classList.remove('salah-sekejap');
        flipped = [];
        mengunci = false;
      }, 900);
    }
  }
}

function selesai() {
  bunyiSelesai();
  clearInterval(timerInterval);
  document.getElementById('win-detail').textContent =
    `Selesai dalam ${langkah} langkah & waktu ${formatWaktu(waktuDetik)}.`;
  document.getElementById('win-overlay').classList.add('show');
  simpanSkorCariPasangan();
}

async function simpanSkorCariPasangan() {
  if (!uidSaya || !tingkatSaya) return;
  const nilai = Math.max(0, 500 - waktuDetik * 3 - langkah * 5);
  try {
    await sb.from('skor_game').insert({
      id_siswa: uidSaya, nama: namaSaya, mapel: mapelSaya, tingkat: tingkatSaya,
      game: 'cari-pasangan', nilai: nilai, waktu_detik: waktuDetik, langkah: langkah
    });
  } catch (e) { console.warn('Gagal simpan skor cari pasangan:', e); }
}

function mulaiUlang() {
  if (window.__pasanganData) buatPapan(window.__pasanganData);
}

init();
</script>
<script>mulaiAplikasi();</script>
