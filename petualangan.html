function formatSusun(a, b) {
  const lebar = Math.max(String(a).length, String(b).length) + 1;
  const baris1 = String(a).padStart(lebar, ' ');
  const baris2 = '+' + String(b).padStart(lebar - 1, ' ');
  const garis = '-'.repeat(lebar + 1);
  return baris1 + '\n' + baris2 + '\n' + garis;
}

// ---------- GENERATOR SOAL STAGE 1 ----------
function buatSoalUrutanHilang() {
  const langkahOpsi = [1, 2, 5, 10, 25, 50, 100];
  const step = langkahOpsi[acakInt(0, langkahOpsi.length - 1)];
  const jumlahSuku = 5;
  const awalMax = Math.max(1, 1000 - step * (jumlahSuku - 1));
  const awal = acakInt(1, awalMax);
  const suku = [];
  for (let i = 0; i < jumlahSuku; i++) suku.push(awal + i * step);
  const posKosong = acakInt(1, jumlahSuku - 2);
  const jawaban = suku[posKosong];
  const tampil = suku.map((v, i) => i === posKosong ? '...' : v);
  const pertanyaan = 'Lengkapi barisan angka berikut:\n' + tampil.join(', ');
  let opsiSet = new Set([jawaban]);
  let percobaan = 0;
  while (opsiSet.size < 4 && percobaan < 30) {
    percobaan++;
    const delta = acakInt(-step * 2, step * 2);
    const kandidat = jawaban + (delta === 0 ? step : delta);
    if (kandidat > 0) opsiSet.add(kandidat);
  }
  const opsi = shuffle([...opsiSet]).map(String);
  return { pertanyaan, opsi, jawabanIndex: opsi.indexOf(String(jawaban)) };
}

function buatSoalUrutkan() {
  let angkaSet = new Set();
  while (angkaSet.size < 4) angkaSet.add(acakInt(1, 1000));
  const angka = [...angkaSet];
  const menaik = Math.random() < 0.5;
  const benarArr = [...angka].sort((a, b) => menaik ? a - b : b - a);
  const benarStr = benarArr.join(', ');
  const pertanyaan = 'Urutkan angka berikut dari yang ' + (menaik ? 'TERKECIL ke TERBESAR' : 'TERBESAR ke TERKECIL') + ':\n' + angka.join(', ');
  let opsiSet = [benarStr];
  let percobaan = 0;
  while (opsiSet.length < 4 && percobaan < 30) {
    percobaan++;
    const acakUrut = shuffle(angka).join(', ');
    if (!opsiSet.includes(acakUrut)) opsiSet.push(acakUrut);
  }
  const opsi = shuffle(opsiSet);
  return { pertanyaan, opsi, jawabanIndex: opsi.indexOf(benarStr) };
}

function buatSoalTetangga() {
  const n = acakInt(2, 998);
  const pertanyaan = 'Berapa angka sebelum dan sesudah ini?\n___ , ' + n + ' , ___';
  const benar = (n - 1) + ' dan ' + (n + 1);
  let opsiSet = [benar];
  let percobaan = 0;
  while (opsiSet.length < 4 && percobaan < 30) {
    percobaan++;
    const a = n + acakInt(-3, 3);
    const b = n + acakInt(-3, 3);
    const str = a + ' dan ' + b;
    if (a === n - 1 && b === n + 1) continue;
    if (!opsiSet.includes(str)) opsiSet.push(str);
  }
  const opsi = shuffle(opsiSet);
  return { pertanyaan, opsi, jawabanIndex: opsi.indexOf(benar) };
}

function s10Kalimat() {
  const nama = xPilih(S5_NAMA), benda = xPilih(S5_BENDA);
  for (let i = 0; i < 50; i++) {
    const t = acakInt(0, 2), a = acakInt(20, 120), b = acakInt(20, 120);
    if (t === 0) {
      const c = acakInt(50, 250), n = c + a - b;
      if (n < a || n > 400) continue;
      return soalNum(`${nama} punya n ${benda}. Ia memberikan ${a} ${benda} kepada temannya, lalu mendapat ${b} ${benda} dari kakaknya. Sekarang ${nama} punya ${c} ${benda}.\nKalimat matematikanya n - ${a} + ${b} = ${c}.\nBerapa nilai n?`, n, 10, 1);
    }
    if (t === 1) {
      const c = acakInt(50, 250), n = c - a + b;
      if (n < 1) continue;
      return soalNum(`${nama} punya n ${benda}. Ia mendapat ${a} ${benda} dari ibunya, lalu memberikan ${b} ${benda} kepada adiknya. Sekarang ${nama} punya ${c} ${benda}.\nKalimat matematikanya n + ${a} - ${b} = ${c}.\nBerapa nilai n?`, n, 10, 1);
    }
    const n = acakInt(20, 150), k = acakInt(10, 100);
    return soalNum(`${nama} punya n ${benda}. Temannya punya ${benda} sebanyak ${nama} juga (n ${benda}), dan kakaknya punya ${k} ${benda}. Jumlah seluruhnya ${2 * n + k} ${benda}.\nKalimat matematikanya n + n + ${k} = ${2 * n + k}.\nBerapa nilai n?`, n, 10, 1);
  }
  return s5Hots();
}
function s10Selisih() {
  const d = bilDigitBeda(); const n = d[0] * 1000 + d[1] * 100 + d[2] * 10 + d[3];
  const pos = [0, 1, 2, 3].filter(k => d[k] !== 0); const i = xPilih(pos); let j; do { j = xPilih(pos); } while (j === i);
  const pangkat = [1000, 100, 10, 1];
  const v1 = d[i] * pangkat[i], v2 = d[j] * pangkat[j], sel = Math.abs(v1 - v2);
  return soalNumKand(`Berapa selisih nilai angka ${d[i]} dan nilai angka ${d[j]} pada bilangan ${rb(n)}?`, sel,
    [v1 + v2, Math.abs(d[i] - d[j]), sel + 100, Math.abs(sel - 100), sel + 1000, Math.abs(sel - 10)], rb, 10, 1);
}

  const benar = idx.map(k => nama[k]).join(', ');

  const daftar = nama.map((n, k) => `${n}: ${rp(nilai[k])}`).join('\n');
  return soalPilih(`Uang tabungan tiga anak:\n${daftar}\nUrutan dari yang uangnya ${naik ? 'PALING SEDIKIT' : 'PALING BANYAK'} adalah ...`, benar, [...salah]);

function s10Pola() {

function s10Cerita() {
  const t = acakInt(0, 2), nama = xPilih(S5_NAMA);
  if (t === 0) {
    const w = acakInt(3, 8), e = acakInt(2, 6), x = acakInt(3, 6), y = acakInt(10, 20), total = x * y, sisa = w * e, z = total - sisa;

function s10Ukur() {

  const kg = acakInt(3, 8), gram = acakInt(2, 8) * 100, pakai = acakInt(1, 2) * 500;

// ---------- INIT & SESI ----------
window.addEventListener('error', function(e) {
  tampilkanToast('Error JS: ' + e.message);
});
window.addEventListener('unhandledrejection', function(e) {
  const pesan = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  tampilkanToast('Error: ' + pesan);
});

async function init() {
  const { data: sesi } = await sb.auth.getSession();
  if (!sesi.session) { window.location.href = 'index.html'; return; }
  uid = sesi.session.user.id;

  try {
    const { data: p, error } = await sb.from('profil').select('*, kelas(tingkat, nama_kelas)').eq('id', uid).single();
    if (error) throw error;
    if (p.status !== 'approved' && p.role !== 'admin') {
      tampilkanPesan('Akun belum disetujui admin.');
      return;
    }
    isAdmin = p.role === 'admin';
    namaSaya = p.nama || 'Siswa';
    const tingkatSaya = p.kelas ? p.kelas.tingkat : null;

    if (!isAdmin && tingkatSaya !== TINGKAT_GAME) {
      tampilkanPesan('Game ini khusus untuk Kelas ' + TINGKAT_GAME + '. Kelas kamu: ' + (p.kelas ? p.kelas.nama_kelas : '-'));
      return;
    }

    const { data: progresStage } = await sb.from('progres_petualangan').select('*').eq('id_siswa', uid).eq('mapel', 'matematika').eq('tingkat', TINGKAT_GAME).maybeSingle();
    tahapTercapai = progresStage ? progresStage.tahap_tercapai : 0;

    renderPeta();
  } catch (e) {
    tampilkanPesan('Gagal memuat: ' + (e.message || e));
  }
}

function tampilkanPesan(teks) {
  document.getElementById('view-peta').style.display = 'none';
  const el = document.getElementById('center-msg');
  el.style.display = 'block';
  el.textContent = teks;
}

async function muatProgresMisi(tahap) {
  progresMisi = {};
  const { data, error } = await sb.from('progres_misi').select('*').eq('id_siswa', uid).eq('mapel', 'matematika').eq('tingkat', TINGKAT_GAME).eq('tahap', tahap);
  if (!error && data) data.forEach(row => { progresMisi[row.misi] = row.bintang; });
}

function renderPeta() {
  const grid = document.getElementById('stage-grid');
  grid.innerHTML = '';
  for (let s = 1; s <= 10; s++) {
    const node = document.createElement('button');
    const adaKonten = !!STAGES[s];
    const terbuka = isAdmin || s === 1 || tahapTercapai >= (s - 1);

    if (adaKonten && terbuka) {
      node.className = 'stage-node buka';
      node.innerHTML = '<span class="angka">' + STAGES[s].icon + '</span><span class="ket">Stage ' + s + '<br>' + STAGES[s].nama + '</span>';
      node.onclick = () => { bunyiKlik(); bukaStage(s); };
    } else {
      node.className = 'stage-node kunci';
      node.innerHTML = '<span class="angka">🔒</span><span class="ket">Stage ' + s + '</span>';
      node.onclick = () => {
        if (adaKonten && !terbuka) tampilkanToast('Selesaikan Stage ' + (s - 1) + ' dulu (kumpulkan cukup bintang).');
        else tampilkanToast('Stage ' + s + ' masih dalam pengembangan.');
      };
    }
    grid.appendChild(node);
  }
  document.getElementById('btn-back').onclick = () => window.location.href = 'mapel.html?mapel=matematika';
}

async function bukaStage(s) {
  tahapAktif = s;
  try {
    await muatProgresMisi(s);
  } catch (e) {
    tampilkanToast('Gagal ambil progres: ' + (e.message || e));
    progresMisi = {};
  }
  renderMisiList();
  pulangKeMisiList();
}

function renderMisiList() {
  const misiList = STAGES[tahapAktif].misi;
  const list = document.getElementById('misi-list');
  list.innerHTML = '';
  misiList.forEach((m, idx) => {
    const bintang = progresMisi[m.id] || 0;
    const bintangSebelumnya = idx === 0 ? 999 : (progresMisi[misiList[idx - 1].id] || 0);
    const terkunci = !isAdmin && idx > 0 && bintangSebelumnya < SYARAT_BINTANG_LANJUT;

    const card = document.createElement('button');
    card.className = 'misi-card' + (terkunci ? ' terkunci' : '');
    card.innerHTML = `
      <div class="num">${terkunci ? '🔒' : m.id}</div>
      <div class="txt"><b>${m.judul}</b><span>${terkunci ? 'Selesaikan misi sebelumnya (min. 2 ★) dulu' : m.desc}</span></div>
      <div class="bintang">${terkunci ? '' : bintangStr(bintang)}</div>
    `;
    card.onclick = () => {
      bunyiKlik();
      if (terkunci) {
        tampilkanToast('Selesaikan Misi ' + misiList[idx - 1].id + ' dengan minimal ' + SYARAT_BINTANG_LANJUT + ' bintang dulu.');
        return;
      }
      mulaiMisi(m);
    };
    list.appendChild(card);
  });

  const totalBintang = misiList.reduce((sum, m) => sum + (progresMisi[m.id] || 0), 0);
  const infoEl = document.getElementById('info-total-bintang');
  if (infoEl) infoEl.textContent = 'Total bintang Stage ' + tahapAktif + ': ' + totalBintang + ' / ' + maksBintangStage(tahapAktif) + ' (perlu ' + syaratBintangStage(tahapAktif) + (tahapAktif === 10 ? ' untuk menamatkan petualangan)' : ' untuk buka stage berikutnya)');
}

// ---------- MAIN GAMEPLAY ----------
let soalSaatIni = [];
let idxSoal = 0;
let salahBerturut = 0;
let bintangPerSoal = [];

function mulaiMisi(misi) {
  misiAktif = misi;
  soalSaatIni = [];
  const sudahAda = new Set();
  for (let i = 0; i < JUMLAH_SOAL; i++) {
    let s, coba = 0;
    do { s = misi.generator(); coba++; } while (sudahAda.has(s.pertanyaan) && coba < 25);
    sudahAda.add(s.pertanyaan);
    soalSaatIni.push(s);
  }
  idxSoal = 0;
  bintangPerSoal = [];
  tampilkanView('view-main');
  document.getElementById('btn-back').onclick = () => pulangKeMisiList();
  tampilkanSoal();
}


function bacaPengaturan() {
  try { return JSON.parse(localStorage.getItem('pengaturan_game') || '{"musik":true,"efek":true}'); }
  catch (e) { return { musik: true, efek: true }; }
}
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function nada(freq, durasi, tipe, waktuMulai) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tipe || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, ctx.currentTime + waktuMulai);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + waktuMulai + durasi);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + waktuMulai);
    osc.stop(ctx.currentTime + waktuMulai + durasi);
  } catch (e) {}
}
function bunyiKlik() { if (bacaPengaturan().efek) nada(600, 0.06, 'square', 0); }
function bunyiBenar() {
  if (!bacaPengaturan().efek) return;
  nada(523, 0.12, 'sine', 0); nada(659, 0.12, 'sine', 0.1); nada(784, 0.18, 'sine', 0.2);
}
function bunyiSalah() { if (bacaPengaturan().efek) nada(200, 0.25, 'sawtooth', 0); }
function bunyiBintang() {
  if (!bacaPengaturan().efek) return;
  nada(784, 0.1, 'sine', 0); nada(988, 0.1, 'sine', 0.08); nada(1175, 0.22, 'sine', 0.16);
}

function tampilkanSoal() {
  salahBerturut = 0;
  const s = soalSaatIni[idxSoal];
  document.getElementById('progress-teks').textContent = 'Soal ' + (idxSoal + 1) + '/' + JUMLAH_SOAL;
  document.getElementById('progress-nyawa').textContent = '♥'.repeat(MAKS_SALAH);
  document.getElementById('soal-teks').textContent = s.pertanyaan;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const opsiList = document.getElementById('opsi-list');
  opsiList.innerHTML = '';
  s.opsi.forEach((teks, i) => {
    const btn = document.createElement('button');
    btn.className = 'opsi-btn';
    btn.textContent = teks;
    btn.onclick = () => jawabSoal(i, btn);
    opsiList.appendChild(btn);
  });
}

function jawabSoal(i, btnEl) {
  const s = soalSaatIni[idxSoal];
  const benar = i === s.jawabanIndex;
  const fb = document.getElementById('feedback');

  if (benar) {
    document.querySelectorAll('.opsi-btn').forEach(b => b.classList.add('disabled'));
    btnEl.classList.add('benar');
    const bintang = salahBerturut === 0 ? 3 : (salahBerturut === 1 ? 2 : 1);
    bintangPerSoal.push(bintang);
    bunyiBenar();
    fb.textContent = 'Benar! ' + bintangStr(bintang);
    fb.className = 'feedback ok';
    setTimeout(lanjutSoal, 1100);
  } else {
    salahBerturut++;
    btnEl.classList.add('salah');
    document.getElementById('progress-nyawa').textContent = '♥'.repeat(Math.max(0, MAKS_SALAH - salahBerturut));
    if (salahBerturut >= MAKS_SALAH) {
      document.querySelectorAll('.opsi-btn').forEach((b, idx2) => {
        b.classList.add('disabled');
        if (idx2 === s.jawabanIndex) b.classList.add('benar');
      });
      bintangPerSoal.push(1);
      bunyiSalah();
      fb.textContent = 'Jawaban yang benar: ' + s.opsi[s.jawabanIndex];
      fb.className = 'feedback err';
      setTimeout(lanjutSoal, 1600);
    } else {
      bunyiSalah();
      btnEl.classList.add('disabled');
      fb.textContent = 'Belum tepat, coba lagi!';
      fb.className = 'feedback err';
    }
  }
}

function lanjutSoal() {
  idxSoal++;
  if (idxSoal < JUMLAH_SOAL) tampilkanSoal();
  else selesaiMisi();
}

async function selesaiMisi() {
  const bintangMisi = Math.min(...bintangPerSoal);
  bunyiBintang();
  document.getElementById('hasil-bintang').textContent = bintangStr(bintangMisi);
  document.getElementById('hasil-detail').textContent = misiAktif.judul + ' — kamu mendapat ' + bintangMisi + ' bintang.';
  tampilkanView('view-hasil');
  document.getElementById('btn-back').onclick = () => pulangKeMisiList();

  document.getElementById('btn-ulangi').onclick = () => mulaiMisi(misiAktif);
  document.getElementById('btn-ke-misi').onclick = () => { renderMisiList(); pulangKeMisiList(); };

  const bintangSebelumnya = progresMisi[misiAktif.id] || 0;
  if (bintangMisi > bintangSebelumnya) {
    progresMisi[misiAktif.id] = bintangMisi;
    try {
      await sb.from('progres_misi').upsert({
        id_siswa: uid, mapel: 'matematika', tingkat: TINGKAT_GAME, tahap: tahapAktif, misi: misiAktif.id, bintang: bintangMisi
      }, { onConflict: 'id_siswa,mapel,tingkat,tahap,misi' });
    } catch (e) { console.warn('Gagal simpan progres misi:', e); }
  }

  const misiList = STAGES[tahapAktif].misi;
  const totalBintangStage = misiList.reduce((sum, m) => sum + (progresMisi[m.id] || 0), 0);
  try {
    await sb.from('skor_game').insert({
      id_siswa: uid, nama: namaSaya, mapel: 'matematika', tingkat: TINGKAT_GAME,
      game: 'petualangan-matematika', nilai: totalBintangStage, tahap: tahapAktif
    });
  } catch (e) { console.warn('Gagal simpan skor petualangan:', e); }

  if (totalBintangStage >= syaratBintangStage(tahapAktif) && tahapTercapai < tahapAktif) {
    tahapTercapai = tahapAktif;
    try {
      await sb.from('progres_petualangan').upsert({
        id_siswa: uid, mapel: 'matematika', tingkat: TINGKAT_GAME, tahap_tercapai: tahapTercapai
      }, { onConflict: 'id_siswa,mapel,tingkat' });
    } catch (e) { console.warn('Gagal simpan progres stage:', e); }
  }
}


let musikInterval = null;
let musikLangkah = 0;
const MELODI_LATAR = [392, 440, 494, 440, 523, 494, 440, 392];
function mulaiMusikLatar() {
  if (musikInterval) return;
  musikInterval = setInterval(() => {
    if (!bacaPengaturan().musik) return;
    const freq = MELODI_LATAR[musikLangkah % MELODI_LATAR.length];
    nada(freq, 0.5, 'sine', 0);
    musikLangkah++;
  }, 650);
}
function hentikanMusikLatar() {
  clearInterval(musikInterval);
  musikInterval = null;
}
document.addEventListener('click', function mulaiSekaliSaja() {
  if (bacaPengaturan().musik) mulaiMusikLatar();
  document.removeEventListener('click', mulaiSekaliSaja);
}, { once: true });

init();

</script>
