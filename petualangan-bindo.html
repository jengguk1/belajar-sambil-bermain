  function ambil(url, ms) {
    return new Promise(function (ok, gagal) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var t = setTimeout(function () { if (ctrl) ctrl.abort(); gagal(new Error('waktu habis')); }, ms);

        .then(function (txt) { clearTimeout(t); ok(txt); }, function (e) { clearTimeout(t); gagal(e); });

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];

function acakHuruf(kata) {
  let arr = kata.split('');
  let hasil = arr.join('');
  let percobaan = 0;
  while (hasil === kata && percobaan < 10) {
    arr = shuffle(arr);
    hasil = arr.join('');
    percobaan++;
  }
  return hasil;
}
function pilihAcak(arr, n) { return shuffle(arr).slice(0, n); }

function buildTebakGambar(item, bank) {
  const pertanyaan = 'Perhatikan gambar berikut. Apa nama benda/kegiatan ini?';
  const lain = pilihAcak(bank.filter(x => x.kata !== item.kata && x.emoji !== item.emoji), 2).map(o => o.kata);
  const opsi = shuffle([item.kata, ...lain]);
  return { pertanyaan, opsi, jawabanIndex: opsi.indexOf(item.kata), gambar: item.emoji };
}
function buildCocokkanArti(item, bank) {
  const pertanyaan = 'Apa arti atau ciri dari kata "' + item.kata + '"?';
  const lain = pilihAcak(bank.filter(x => x.kata !== item.kata), 2).map(o => o.deskripsi);
  const opsi = shuffle([item.deskripsi, ...lain]);
  return { pertanyaan, opsi, jawabanIndex: opsi.indexOf(item.deskripsi) };
}
function buildLengkapiKalimat(item, bank) {
  const pertanyaan = 'Lengkapi kalimat berikut:\n"' + item.kalimat + '"';
  const lain = pilihAcak(bank.filter(x => x.kata !== item.kata), 2).map(o => o.kata);

}
function buildSusunHuruf(item, bank) {
  const kataAsli = item.kata;
  const acak = acakHuruf(kataAsli.toUpperCase());
  const pertanyaan = 'Susun huruf berikut menjadi kata yang benar:\n' + acak.split('').join('  ');
  const lain = pilihAcak(bank.filter(x => x.kata !== kataAsli), 2).map(o => o.kata);
  const opsi = shuffle([kataAsli, ...lain]);
  return { pertanyaan, opsi, jawabanIndex: opsi.indexOf(kataAsli) };
}
function buildCerita(item, bank) {
  const NAMA = ['Ani', 'Budi', 'Sari', 'Dodi', 'Rina', 'Tono'];
  const nama = NAMA[acakInt(0, NAMA.length - 1)];
  const pertanyaan = `${nama} sedang belajar sesuatu yang baru. ${nama} diberi tahu: "${item.deskripsi}". Apa yang sedang dipelajari ${nama}?`;
  const lain = pilihAcak(bank.filter(x => x.kata !== item.kata), 2).map(o => o.kata);
  const opsi = shuffle([item.kata, ...lain]);
  return { pertanyaan, opsi, jawabanIndex: opsi.indexOf(item.kata) };
}

// Tiap misi punya antrian sendiri (dikocok dari bank) supaya 1x main tidak ada soal berulang.
// Kalau antrian habis (semua kata sudah keluar), baru dikocok ulang dari awal.
function buatMisiDariBank(bank) {
  return MISI_TEMPLATE.map(t => {
    const pool = t.pool ? bank.filter(t.pool) : bank;
    let antrian = [];
    function isiUlang() { antrian = shuffle(pool); }
    isiUlang();
    function ambil() {
      if (antrian.length === 0) isiUlang();
      const item = antrian.pop();
      return t.builder(item, pool);
    }
    return { id: t.id, judul: t.judul, desc: t.desc, generator: ambil, reset: isiUlang };
  });
}

  1: { nama: 'Mengenal Berbagai Perayaan', icon: '🎉', misi: buatMisiDariBank(BANK_PERAYAAN) },
  2: { nama: 'Menjaga Kesehatan', icon: '🩺', misi: buatMisiDariBank(BANK_KESEHATAN) },

// ---------- INIT & SESI ----------
async function init() {
  const { data: sesi } = await sb.auth.getSession();
  if (!sesi.session) { window.location.href = 'index.html'; return; }
  uid = sesi.session.user.id;

  try {
    const { data: p, error } = await sb.from('profil').select('*, kelas(tingkat, nama_kelas)').eq('id', uid).single();
    if (error) throw error;
    if (p.status !== 'approved' && p.role !== 'admin') {
      tampilkanPesan('Akun belum disetujui admin.');
      return;
    }
    isAdmin = p.role === 'admin';
    namaSaya = p.nama || 'Siswa';
    const tingkatSaya = p.kelas ? p.kelas.tingkat : null;

    if (!isAdmin && tingkatSaya !== TINGKAT_GAME) {
      tampilkanPesan('Game ini khusus untuk Kelas ' + TINGKAT_GAME + '. Kelas kamu: ' + (p.kelas ? p.kelas.nama_kelas : '-'));
      return;
    }

    const { data: progresStage } = await sb.from('progres_petualangan').select('*').eq('id_siswa', uid).eq('mapel', MAPEL_GAME).eq('tingkat', TINGKAT_GAME).maybeSingle();
    tahapTercapai = progresStage ? progresStage.tahap_tercapai : 0;

    renderPeta();
  } catch (e) {
    tampilkanPesan('Gagal memuat: ' + (e.message || e));
  }
}

function tampilkanPesan(teks) {
  document.getElementById('view-peta').style.display = 'none';
  const el = document.getElementById('center-msg');
  el.style.display = 'block';
  el.textContent = teks;
}

async function muatProgresMisi(tahap) {
  progresMisi = {};
  const { data, error } = await sb.from('progres_misi').select('*').eq('id_siswa', uid).eq('mapel', MAPEL_GAME).eq('tingkat', TINGKAT_GAME).eq('tahap', tahap);
  if (!error && data) data.forEach(row => { progresMisi[row.misi] = row.bintang; });
}

function renderPeta() {
  const grid = document.getElementById('stage-grid');
  grid.innerHTML = '';
  for (let s = 1; s <= 10; s++) {
    const node = document.createElement('button');
    const adaKonten = !!STAGES[s];
    const terbuka = isAdmin || s === 1 || tahapTercapai >= (s - 1);

    if (adaKonten && terbuka) {
      node.className = 'stage-node buka';
      node.innerHTML = '<span class="angka">' + STAGES[s].icon + '</span><span class="ket">Stage ' + s + '<br>' + STAGES[s].nama + '</span>';
      node.onclick = () => { bunyiKlik(); bukaStage(s); };
    } else {
      node.className = 'stage-node kunci';
      node.innerHTML = '<span class="angka">🔒</span><span class="ket">Stage ' + s + '</span>';
      node.onclick = () => {
        if (adaKonten && !terbuka) tampilkanToast('Selesaikan Stage ' + (s - 1) + ' dulu (kumpulkan cukup bintang).');
        else tampilkanToast('Stage ' + s + ' masih dalam pengembangan.');
      };
    }
    grid.appendChild(node);
  }
  document.getElementById('btn-back').onclick = () => window.location.href = 'mapel.html?mapel=bahasa_indonesia';
}

async function bukaStage(s) {
  tahapAktif = s;
  try {
    await muatProgresMisi(s);
  } catch (e) {
    tampilkanToast('Gagal ambil progres: ' + (e.message || e));
    progresMisi = {};
  }
  renderMisiList();
  pulangKeMisiList();
}

function renderMisiList() {
  const misiList = STAGES[tahapAktif].misi;
  const list = document.getElementById('misi-list');
  list.innerHTML = '';
  misiList.forEach((m, idx) => {
    const bintang = progresMisi[m.id] || 0;
    const bintangSebelumnya = idx === 0 ? 999 : (progresMisi[misiList[idx - 1].id] || 0);
    const terkunci = !isAdmin && idx > 0 && bintangSebelumnya < SYARAT_BINTANG_LANJUT;

    const card = document.createElement('button');
    card.className = 'misi-card' + (terkunci ? ' terkunci' : '');
    card.innerHTML = `
      <div class="num">${terkunci ? '🔒' : m.id}</div>
      <div class="txt"><b>${m.judul}</b><span>${terkunci ? 'Selesaikan misi sebelumnya (min. 2 ★) dulu' : m.desc}</span></div>
      <div class="bintang">${terkunci ? '' : bintangStr(bintang)}</div>
    `;
    card.onclick = () => {
      bunyiKlik();
      if (terkunci) {
        tampilkanToast('Selesaikan Misi ' + misiList[idx - 1].id + ' dengan minimal ' + SYARAT_BINTANG_LANJUT + ' bintang dulu.');
        return;
      }
      mulaiMisi(m);
    };
    list.appendChild(card);
  });

  const totalBintang = misiList.reduce((sum, m) => sum + (progresMisi[m.id] || 0), 0);
  const infoEl = document.getElementById('info-total-bintang');
  if (infoEl) infoEl.textContent = 'Total bintang Stage ' + tahapAktif + ': ' + totalBintang + ' / 15 (perlu ' + SYARAT_TOTAL_STAGE + ' untuk buka stage berikutnya)';
}

// ---------- MAIN GAMEPLAY ----------
let soalSaatIni = [];
let idxSoal = 0;
let salahBerturut = 0;
let bintangPerSoal = [];

function mulaiMisi(misi) {
  misiAktif = misi;
  if (misi.reset) misi.reset();
  soalSaatIni = [];
  for (let i = 0; i < JUMLAH_SOAL; i++) soalSaatIni.push(misi.generator());
  idxSoal = 0;
  bintangPerSoal = [];
  tampilkanView('view-main');
  document.getElementById('btn-back').onclick = () => pulangKeMisiList();
  tampilkanSoal();
}


function bacaPengaturan() {
  try { return JSON.parse(localStorage.getItem('pengaturan_game') || '{"musik":true,"efek":true}'); }
  catch (e) { return { musik: true, efek: true }; }
}
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function nada(freq, durasi, tipe, waktuMulai) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tipe || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, ctx.currentTime + waktuMulai);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + waktuMulai + durasi);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + waktuMulai);
    osc.stop(ctx.currentTime + waktuMulai + durasi);
  } catch (e) {}
}
function bunyiKlik() { if (bacaPengaturan().efek) nada(600, 0.06, 'square', 0); }
function bunyiBenar() {
  if (!bacaPengaturan().efek) return;
  nada(523, 0.12, 'sine', 0); nada(659, 0.12, 'sine', 0.1); nada(784, 0.18, 'sine', 0.2);
}
function bunyiSalah() { if (bacaPengaturan().efek) nada(200, 0.25, 'sawtooth', 0); }
function bunyiBintang() {
  if (!bacaPengaturan().efek) return;
  nada(784, 0.1, 'sine', 0); nada(988, 0.1, 'sine', 0.08); nada(1175, 0.22, 'sine', 0.16);
}

function tampilkanSoal() {
  salahBerturut = 0;
  const s = soalSaatIni[idxSoal];
  document.getElementById('progress-teks').textContent = 'Soal ' + (idxSoal + 1) + '/' + JUMLAH_SOAL;
  document.getElementById('progress-nyawa').textContent = '♥'.repeat(MAKS_SALAH);
  document.getElementById('soal-teks').textContent = s.pertanyaan;
  const elGambar = document.getElementById('soal-gambar');
  if (s.gambar) {
    elGambar.textContent = s.gambar;
    elGambar.style.display = 'block';
  } else {
    elGambar.style.display = 'none';
  }
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const opsiList = document.getElementById('opsi-list');
  opsiList.innerHTML = '';
  s.opsi.forEach((teks, i) => {
    const btn = document.createElement('button');
    btn.className = 'opsi-btn';
    btn.textContent = teks;
    btn.onclick = () => jawabSoal(i, btn);
    opsiList.appendChild(btn);
  });
}

function jawabSoal(i, btnEl) {
  const s = soalSaatIni[idxSoal];
  const benar = i === s.jawabanIndex;
  const fb = document.getElementById('feedback');

  if (benar) {
    document.querySelectorAll('.opsi-btn').forEach(b => b.classList.add('disabled'));
    btnEl.classList.add('benar');
    const bintang = salahBerturut === 0 ? 3 : (salahBerturut === 1 ? 2 : 1);
    bintangPerSoal.push(bintang);
    bunyiBenar();
    fb.textContent = 'Benar! ' + bintangStr(bintang);
    fb.className = 'feedback ok';
    setTimeout(lanjutSoal, 1100);
  } else {
    salahBerturut++;
    btnEl.classList.add('salah');
    document.getElementById('progress-nyawa').textContent = '♥'.repeat(Math.max(0, MAKS_SALAH - salahBerturut));
    if (salahBerturut >= MAKS_SALAH) {
      document.querySelectorAll('.opsi-btn').forEach((b, idx2) => {
        b.classList.add('disabled');
        if (idx2 === s.jawabanIndex) b.classList.add('benar');
      });
      bintangPerSoal.push(1);
      bunyiSalah();
      fb.textContent = 'Jawaban yang benar: ' + s.opsi[s.jawabanIndex];
      fb.className = 'feedback err';
      setTimeout(lanjutSoal, 1600);
    } else {
      bunyiSalah();
      btnEl.classList.add('disabled');
      fb.textContent = 'Belum tepat, coba lagi!';
      fb.className = 'feedback err';
    }
  }
}

function lanjutSoal() {
  idxSoal++;
  if (idxSoal < JUMLAH_SOAL) tampilkanSoal();
  else selesaiMisi();
}

async function selesaiMisi() {
  const bintangMisi = Math.min(...bintangPerSoal);
  bunyiBintang();
  document.getElementById('hasil-bintang').textContent = bintangStr(bintangMisi);
  document.getElementById('hasil-detail').textContent = misiAktif.judul + ' — kamu mendapat ' + bintangMisi + ' bintang.';
  tampilkanView('view-hasil');
  document.getElementById('btn-back').onclick = () => pulangKeMisiList();

  document.getElementById('btn-ulangi').onclick = () => mulaiMisi(misiAktif);
  document.getElementById('btn-ke-misi').onclick = () => { renderMisiList(); pulangKeMisiList(); };

  const bintangSebelumnya = progresMisi[misiAktif.id] || 0;
  if (bintangMisi > bintangSebelumnya) {
    progresMisi[misiAktif.id] = bintangMisi;
    try {
      await sb.from('progres_misi').upsert({
        id_siswa: uid, mapel: MAPEL_GAME, tingkat: TINGKAT_GAME, tahap: tahapAktif, misi: misiAktif.id, bintang: bintangMisi
      }, { onConflict: 'id_siswa,mapel,tingkat,tahap,misi' });
    } catch (e) { console.warn('Gagal simpan progres misi:', e); }
  }

  const misiList = STAGES[tahapAktif].misi;
  const totalBintangStage = misiList.reduce((sum, m) => sum + (progresMisi[m.id] || 0), 0);
  try {
    await sb.from('skor_game').insert({
      id_siswa: uid, nama: namaSaya, mapel: MAPEL_GAME, tingkat: TINGKAT_GAME,
      game: 'petualangan-bindo', nilai: totalBintangStage, tahap: tahapAktif
    });
  } catch (e) { console.warn('Gagal simpan skor petualangan:', e); }

  if (totalBintangStage >= SYARAT_TOTAL_STAGE && tahapTercapai < tahapAktif) {
    tahapTercapai = tahapAktif;
    try {
      await sb.from('progres_petualangan').upsert({
        id_siswa: uid, mapel: MAPEL_GAME, tingkat: TINGKAT_GAME, tahap_tercapai: tahapTercapai
      }, { onConflict: 'id_siswa,mapel,tingkat' });
    } catch (e) { console.warn('Gagal simpan progres stage:', e); }
  }
}

window.addEventListener('error', function(e) { tampilkanToast('Error JS: ' + e.message); });
window.addEventListener('unhandledrejection', function(e) {
  const pesan = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  tampilkanToast('Error: ' + pesan);
});


let musikInterval = null;
let musikLangkah = 0;
const MELODI_LATAR = [392, 440, 494, 440, 523, 494, 440, 392];
function mulaiMusikLatar() {
  if (musikInterval) return;
  musikInterval = setInterval(() => {
    if (!bacaPengaturan().musik) return;
    const freq = MELODI_LATAR[musikLangkah % MELODI_LATAR.length];
    nada(freq, 0.5, 'sine', 0);
    musikLangkah++;
  }, 650);
}
function hentikanMusikLatar() {
  clearInterval(musikInterval);
  musikInterval = null;
}
document.addEventListener('click', function mulaiSekaliSaja() {
  if (bacaPengaturan().musik) mulaiMusikLatar();
  document.removeEventListener('click', mulaiSekaliSaja);
}, { once: true });

init();
