    'https://gcore.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  var banner = null;
  function tampilBanner(teks, tombol, aksi) {
    if (!banner) {
      banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;background:#F5C542;color:#0B2A4A;font:800 0.85rem Trebuchet MS,sans-serif;padding:9px 16px;border-radius:999px;border:2px solid #7A5A12;box-shadow:0 6px 16px rgba(0,0,0,.4);text-align:center;max-width:90vw;';
      document.body.appendChild(banner);
    }
    banner.textContent = teks + ' ';
    if (tombol) {
      var b = document.createElement('button');
      b.textContent = tombol;
      b.style.cssText = 'margin-left:6px;padding:4px 10px;border-radius:999px;border:2px solid #0B2A4A;background:#fff;color:#0B2A4A;font:800 0.8rem Trebuchet MS,sans-serif;cursor:pointer;';
      b.onclick = aksi;
      banner.appendChild(b);
    }
  }
  function hapusBanner() { if (banner && banner.parentNode) banner.parentNode.removeChild(banner); banner = null; }
  function libSiap() { return !!(window.supabase && typeof window.supabase.createClient === 'function'); }
  function jalankanKode(kode) {
    var s = document.createElement('script');
    s.text = kode;
    document.head.appendChild(s);
    return libSiap();
  }
  function ambil(url, ms) {
    return new Promise(function (ok, gagal) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var t = setTimeout(function () { if (ctrl) ctrl.abort(); gagal(new Error('waktu habis')); }, ms);
      fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'force-cache' })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
        .then(function (txt) { clearTimeout(t); ok(txt); }, function (e) { clearTimeout(t); gagal(e); });
    });
  }
  function siapkanLib() {
    try {
      var simpan = localStorage.getItem(KUNCI);
      if (simpan) { if (jalankanKode(simpan)) return Promise.resolve(); localStorage.removeItem(KUNCI); }
    } catch (e) {}
    var i = 0;
    function coba() {
      if (i >= SUMBER.length) return Promise.reject(new Error('semua sumber gagal'));
      var url = SUMBER[i++];
      return ambil(url, 9000).then(function (txt) {
        if (txt.length < 50000 || txt.indexOf('createClient') < 0) throw new Error('isi tidak valid');
        if (!jalankanKode(txt)) throw new Error('library tidak aktif');
        try { localStorage.setItem(KUNCI, txt); } catch (e) {}
      }).catch(function () { return coba(); });
    }
    return coba();
  }
  window.mulaiAplikasi = function () {
    var el = document.getElementById('kode-app');
    function jalan() { var s = document.createElement('script'); s.text = el.textContent; document.head.appendChild(s); hapusBanner(); }
    if (libSiap()) { jalan(); return; }
    tampilBanner('Menyiapkan aplikasi...');
    siapkanLib().then(jalan, function () {
      tampilBanner('Koneksi lambat atau terputus.', 'Coba Lagi', function () { window.mulaiAplikasi(); });
    });
  };
})();

let mapelAktif = null;
let tingkatSaya = null;
let isAdmin = false;
let timerToast = null;

function tampilkanToast(teks) {
  const t = document.getElementById('toast');
  t.textContent = teks;
  t.classList.add('show');
  clearTimeout(timerToast);
  timerToast = setTimeout(() => t.classList.remove('show'), 1800);
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const mapel = params.get('mapel');
  if (!mapel || !MAPEL_INFO[mapel]) {
    window.location.href = 'beranda.html';
    return;
  }
  mapelAktif = mapel;
  document.getElementById('judul-mapel').textContent = MAPEL_INFO[mapel].nama;
  document.getElementById('icon-mapel').src = MAPEL_INFO[mapel].icon;

  const { data: sesi } = await sb.auth.getSession();
  if (!sesi.session) {
    window.location.href = 'index.html';
    return;
  }
  const uid = sesi.session.user.id;

  try {
    const { data: profilData, error } = await sb.from('profil').select('*, kelas(nama_kelas, tingkat)').eq('id', uid).single();
    if (error) throw error;

    if (profilData.status !== 'approved' && profilData.role !== 'admin') {
      document.getElementById('info-kelas').textContent = 'Akun belum disetujui admin.';
      return;
    }

    isAdmin = profilData.role === 'admin';
    tingkatSaya = profilData.kelas ? profilData.kelas.tingkat : null;
    document.getElementById('info-kelas').textContent = isAdmin ? 'Admin' : (profilData.kelas ? profilData.kelas.nama_kelas : 'Kelas belum diatur');

    renderKelasGrid();
    document.getElementById('area-kelas').style.display = 'block';

    if (tingkatSaya) pilihKelas(tingkatSaya, true);
  } catch (e) {
    document.getElementById('center-msg').style.display = 'block';
    document.getElementById('center-msg').textContent = 'Gagal memuat profil: ' + (e.message || e);
  }
}

function renderKelasGrid() {
  const grid = document.getElementById('kelas-grid');
  grid.innerHTML = '';
  for (let k = 1; k <= 6; k++) {
    const boleh = isAdmin || k === tingkatSaya;
    const btn = document.createElement('button');
    btn.className = 'kelas-btn' + (boleh ? '' : ' locked');
    btn.id = 'kelas-btn-' + k;
    btn.innerHTML = 'Kelas ' + k + (boleh ? '' : '<span class="lock">🔒 Bukan kelasmu</span>');
    btn.onclick = () => {
      if (!boleh) {
        tampilkanToast('Kamu cuma bisa akses kelasmu sendiri.');
        return;
      }
      pilihKelas(k, false);
    };
    grid.appendChild(btn);
  }
}

function pilihKelas(k, awal) {
  document.querySelectorAll('.kelas-btn').forEach(b => b.classList.remove('selected'));
  const sel = document.getElementById('kelas-btn-' + k);
  if (sel) sel.classList.add('selected');

  const cpAktif = (mapelAktif === 'bahasa_indonesia' && k === 1);
  const paMatematika = (mapelAktif === 'matematika' && k === 3);
  const paBindo = (mapelAktif === 'bahasa_indonesia' && k === 2);
  const paAktif = paMatematika || paBindo;
  const raceAktif = (mapelAktif === 'matematika');
  const jutawanAktif = true;
  const kuisAktif = true;
  const areaMain = document.getElementById('area-main');

  if (cpAktif || paAktif || raceAktif || jutawanAktif || kuisAktif) {
    areaMain.style.display = 'block';
    const kuisBtn = document.getElementById('btn-kuis');
    kuisBtn.onclick = () => window.location.href = 'kuis.html?mapel=' + mapelAktif + '&kelas=' + k;
    const cpBtn = document.getElementById('btn-cari-pasangan');
    if (cpAktif) {
      cpBtn.style.display = 'flex';
      cpBtn.classList.remove('disabled');
      document.getElementById('cp-arrow').style.display = 'inline';
      cpBtn.onclick = () => window.location.href = 'cari-pasangan.html?mapel=' + mapelAktif;
    } else {
      cpBtn.style.display = 'none';
    }
    let paBtn = document.getElementById('btn-petualangan');
    if (paAktif) {
      if (!paBtn) {
        paBtn = document.createElement('button');
        paBtn.id = 'btn-petualangan';
        paBtn.className = 'menu-item';
        paBtn.style.marginTop = '12px';
        areaMain.appendChild(paBtn);
      }
      paBtn.style.display = 'flex';
      if (paMatematika) {
        paBtn.innerHTML = '<span class="emoji">🤖</span><span class="txt"><b>Petualangan Pak Aji</b><span>Stage 1: SDN Tamberu 1</span></span><span class="arrow">&rarr;</span>';
        paBtn.onclick = () => window.location.href = 'petualangan.html';
      } else if (paBindo) {
        paBtn.innerHTML = '<span class="emoji">🤖</span><span class="txt"><b>Petualangan Pak Aji</b><span>Stage 1: Mengenal Berbagai Perayaan</span></span><span class="arrow">&rarr;</span>';
        paBtn.onclick = () => window.location.href = 'petualangan-bindo.html';
      }
    } else if (paBtn) {
      paBtn.style.display = 'none';
    }
    let raceBtn = document.getElementById('btn-race');
    if (raceAktif) {
      if (!raceBtn) {
        raceBtn = document.createElement('button');
        raceBtn.id = 'btn-race';
        raceBtn.className = 'menu-item';
        raceBtn.style.marginTop = '12px';
        raceBtn.innerHTML = '<span class="emoji">🏃</span><span class="txt"><b>Race Berhitung</b><span>Adu cepat jawab soal, 60 detik!</span></span><span class="arrow">&rarr;</span>';
        raceBtn.onclick = () => window.location.href = 'race-berhitung.html';
        areaMain.appendChild(raceBtn);
      }
      raceBtn.style.display = 'flex';
    } else if (raceBtn) {
      raceBtn.style.display = 'none';
    }
    let jutawanBtn = document.getElementById('btn-jutawan');
    if (jutawanAktif) {
      if (!jutawanBtn) {
        jutawanBtn = document.createElement('button');
        jutawanBtn.id = 'btn-jutawan';
        jutawanBtn.className = 'menu-item';
        jutawanBtn.style.marginTop = '12px';
        jutawanBtn.innerHTML = '<span class="emoji">💰</span><span class="txt"><b>Siapa Ingin Jadi Jutawan?</b><span>15 level, makin tinggi makin sulit</span></span><span class="arrow">&rarr;</span>';
        jutawanBtn.onclick = () => window.location.href = 'jutawan.html?mapel=' + mapelAktif + '&kelas=' + k;
        areaMain.appendChild(jutawanBtn);
      }
      jutawanBtn.style.display = 'flex';
    } else if (jutawanBtn) {
      jutawanBtn.style.display = 'none';
    }
  } else {
    areaMain.style.display = 'none';
  }
}

init();
</script>
