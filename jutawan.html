  ];
  const t = templates[acakInt(0,templates.length-1)]();
  return { pertanyaan: t.p, ...buatOpsiAngka(t.j, Math.max(10, Math.round(t.j*0.1))) };

function tingkatUntukLevel(level) {
  if (level <= 5) return 'mudah';
  if (level <= 10) return 'sedang';
  return 'sulit';
}
function buatSoalUntukLevel(level) {
  const t = tingkatUntukLevel(level);
  if (mapelAktif === 'matematika') return t === 'mudah' ? soalMtkMudah() : t === 'sedang' ? soalMtkSedang() : soalMtkSulit();
  if (mapelAktif === 'bahasa_indonesia') return t === 'sulit' ? soalBindoHots(antrianBindoHots) : soalBindoBasic(antrianBindoBasic);
  if (mapelAktif === 'ipas') return t === 'mudah' ? soalIpasBasic(antrianIpasMudah) : t === 'sedang' ? soalIpasBasic(antrianIpasSedang) : soalIpasBasic(antrianIpasHots);
  if (mapelAktif === 'pendidikan_pancasila') return t === 'mudah' ? soalPknBasic(antrianPknMudah) : t === 'sedang' ? soalPknBasic(antrianPknSedang) : soalPknBasic(antrianPknHots);
  return soalMtkMudah();
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  mapelAktif = params.get('mapel');
  if (!mapelAktif || !NAMA_MAPEL[mapelAktif]) { window.location.href = 'beranda.html'; return; }
  document.getElementById('judul-brand').textContent = '💰 JUTAWAN ' + NAMA_MAPEL[mapelAktif].toUpperCase();
  document.getElementById('intro-judul').textContent = 'Siap Jadi Jutawan ' + NAMA_MAPEL[mapelAktif] + '?';
  document.getElementById('btn-back').onclick = () => window.location.href = 'mapel.html?mapel=' + mapelAktif;
  document.getElementById('btn-kembali-mapel').onclick = () => window.location.href = 'mapel.html?mapel=' + mapelAktif;
  renderTanggaMini();

  const { data: sesi } = await sb.auth.getSession();
  if (!sesi.session) { window.location.href = 'index.html'; return; }
  uid = sesi.session.user.id;
  try {
    const { data: p, error } = await sb.from('profil').select('*, kelas(tingkat)').eq('id', uid).single();
    if (error) throw error;
    if (p.status !== 'approved' && p.role !== 'admin') { tampilkanPesan('Akun belum disetujui admin.'); return; }
    let tingkatSaya = p.kelas ? p.kelas.tingkat : null;
    const kelasParam = params.get('kelas');
    if (p.role === 'admin' && kelasParam) tingkatSaya = parseInt(kelasParam, 10);
    if (p.role !== 'admin' && !tingkatSaya) { tampilkanPesan('Kelas kamu belum diatur. Hubungi admin.'); return; }
    TINGKAT_GAME = tingkatSaya || 3;
    namaSaya = p.nama || 'Siswa';
  } catch (e) { tampilkanPesan('Gagal memuat profil: ' + (e.message || e)); }
}
function tampilkanPesan(teks) {
  document.getElementById('view-intro').style.display = 'none';
  const el = document.getElementById('center-msg'); el.style.display = 'block'; el.textContent = teks;
}
function renderTanggaMini() {
  const el = document.getElementById('tangga-mini'); el.innerHTML = '';
  [15,10,5,1].forEach(lv => {
    const d = document.createElement('div');
    d.className = 'baris' + (LEVEL_AMAN.includes(lv) ? ' aman' : '');
    d.innerHTML = `<span>${lv}</span><span>${formatPoin(POIN_LADDER[lv-1])}</span>`;
    el.appendChild(d);
  });
}
function renderTangga() {
  const el = document.getElementById('tangga'); el.innerHTML = '';
  for (let lv = 15; lv >= 1; lv--) {
    const d = document.createElement('div');
    let cls = 'baris';
    if (LEVEL_AMAN.includes(lv)) cls += ' aman';
    if (lv === levelSaat + 1) cls += ' aktif';
    if (lv < levelSaat + 1) cls += ' lewat';
    d.className = cls;
    d.innerHTML = `<span>${lv}</span><span>${formatPoin(POIN_LADDER[lv-1])}</span>`;
    el.appendChild(d);
  }
}

  soalSaatIni.opsi.forEach((teks, i) => {
    const btn = document.createElement('button');
    btn.className = 'opsi-btn';
    btn.dataset.idx = i;
    btn.textContent = huruf[i] + '. ' + teks;
    btn.onclick = () => pilihOpsi(i, btn);
    opsiList.appendChild(btn);
  });
  document.getElementById('btn-kunci').disabled = true;
  document.getElementById('btn-kunci').classList.add('disabled');
}
let opsiDipilih = null;
function pilihOpsi(i, btnEl) {
  if (terkunci) return;
  document.querySelectorAll('.opsi-btn').forEach(b => b.style.outline = 'none');
  btnEl.style.outline = '3px solid ' + getComputedStyle(document.documentElement).getPropertyValue('--gold-dark');
  opsiDipilih = i;
  document.getElementById('btn-kunci').disabled = false;
  document.getElementById('btn-kunci').classList.remove('disabled');
}
function pakai5050() {
  if (sudahPakai5050 || terkunci) return;
  sudahPakai5050 = true;
  document.getElementById('btn-5050').classList.add('used');
  const salahIdx = soalSaatIni.opsi.map((_, i) => i).filter(i => i !== soalSaatIni.jawabanIndex);
  const hilang = shuffle(salahIdx).slice(0, 2);
  hilang.forEach(i => {
    const b = document.querySelector('.opsi-btn[data-idx="' + i + '"]');
    if (b) b.classList.add('hidden-5050');
  });
  tampilkanToast('2 jawaban salah dihilangkan!');
}
function kunciJawaban() {
  if (terkunci || opsiDipilih === null) return;
  terkunci = true;
  const benar = opsiDipilih === soalSaatIni.jawabanIndex;
  document.querySelectorAll('.opsi-btn').forEach(b => b.classList.add('disabled'));
  const btnTerpilih = document.querySelector('.opsi-btn[data-idx="' + opsiDipilih + '"]');
  if (benar) {
    bunyiBenar();
    btnTerpilih.classList.add('benar');
    setTimeout(() => lanjutSetelahBenar(), 1200);
  } else {
    bunyiSalah();
    btnTerpilih.classList.add('salah');
    const btnBenar = document.querySelector('.opsi-btn[data-idx="' + soalSaatIni.jawabanIndex + '"]');
    if (btnBenar) btnBenar.classList.add('benar');
    setTimeout(() => selesaiGame(false), 1600);
  }
}
function lanjutSetelahBenar() {
  if (levelSaat === 14) { selesaiGame(true); return; }
  levelSaat++;
  opsiDipilih = null;
  tampilkanSoalLevel();
}
function poinAman(sampaiLevelSalah) {
  // cari poin aman tertinggi yg sudah dilewati sebelum level yg salah
  let aman = 0;
  for (const lv of LEVEL_AMAN) { if (sampaiLevelSalah > lv) aman = POIN_LADDER[lv - 1]; }
  return aman;
}
async function selesaiGame(menang) {
  let poinAkhir;
  if (menang) { poinAkhir = POIN_LADDER[14]; bunyiMenang(); }
  else { poinAkhir = poinAman(levelSaat + 1); }

  document.getElementById('hasil-emoji').textContent = menang ? '🏆' : (poinAkhir > 0 ? '🎉' : '😅');
  document.getElementById('hasil-judul').textContent = menang ? 'JUTAWAN SEJATI!' : 'Permainan Berakhir';
  document.getElementById('hasil-poin').textContent = formatPoin(poinAkhir) + ' Poin';
  document.getElementById('hasil-detail').textContent = menang
    ? 'Luar biasa! Kamu menjawab semua 15 soal dengan benar!'
    : 'Kamu berhenti di Level ' + (levelSaat + 1) + '. ' + (poinAkhir > 0 ? 'Poin aman tetap kamu bawa pulang.' : 'Coba lagi, yuk!');
  tampilkanView('view-hasil');
  await simpanSkorJutawan(poinAkhir, menang);
}
async function simpanSkorJutawan(poinAkhir, menang) {
  if (!uid) return;
  try {
    await sb.from('skor_game').insert({
      id_siswa: uid, nama: namaSaya, mapel: mapelAktif, tingkat: TINGKAT_GAME,
      game: 'millionaire', nilai: poinAkhir, tahap: menang ? 15 : levelSaat + 1
    });
  } catch (e) { console.warn('Gagal simpan skor jutawan:', e); }
}

init();
</script>
<script>mulaiAplikasi();</script>
