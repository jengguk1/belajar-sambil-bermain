      b.onclick = aksi;

  function hapusBanner() { if (banner && banner.parentNode) banner.parentNode.removeChild(banner); banner = null; }
  function libSiap() { return !!(window.supabase && typeof window.supabase.createClient === 'function'); }
  function jalankanKode(kode) {
    var s = document.createElement('script');
    s.text = kode;
    document.head.appendChild(s);
    return libSiap();
  }
  function ambil(url, ms) {
    return new Promise(function (ok, gagal) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var t = setTimeout(function () { if (ctrl) ctrl.abort(); gagal(new Error('waktu habis')); }, ms);
      fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'force-cache' })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
        .then(function (txt) { clearTimeout(t); ok(txt); }, function (e) { clearTimeout(t); gagal(e); });
    });
  }
  function siapkanLib() {
    try {
      var simpan = localStorage.getItem(KUNCI);
      if (simpan) { if (jalankanKode(simpan)) return Promise.resolve(); localStorage.removeItem(KUNCI); }
    } catch (e) {}
    var i = 0;
    function coba() {
      if (i >= SUMBER.length) return Promise.reject(new Error('semua sumber gagal'));
      var url = SUMBER[i++];
      return ambil(url, 9000).then(function (txt) {
        if (txt.length < 50000 || txt.indexOf('createClient') < 0) throw new Error('isi tidak valid');
        if (!jalankanKode(txt)) throw new Error('library tidak aktif');
        try { localStorage.setItem(KUNCI, txt); } catch (e) {}
      }).catch(function () { return coba(); });
    }
    return coba();
  }

<script type="text/plain" id="kode-app">
const SUPABASE_URL = "https://dyxmilgvaymkbzgjtvln.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eG1pbGd2YXlta2J6Z2p0dmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDI0NTAsImV4cCI6MjEwNTQxODQ1MH0.FbzeXaVS2WIhbd1U3RMoqvYxieD-_x-o7PYmS4zmrcE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DURASI_DETIK = 60;
let tingkatSaya = 3;
let uidSaya = null;
let namaSaya = 'Siswa';
let waktuSisa = DURASI_DETIK;
let timerRace = null;
let skorBenar = 0;
let skorSalah = 0;
let soalIni = null;

function acakInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function tampilkanView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function bacaPengaturan() {
  try { return JSON.parse(localStorage.getItem('pengaturan_game') || '{"musik":true,"efek":true}'); }
  catch (e) { return { musik: true, efek: true }; }
}
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function nada(freq, durasi, tipe, waktuMulai) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = tipe || 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, ctx.currentTime + waktuMulai);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + waktuMulai + durasi);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime + waktuMulai); osc.stop(ctx.currentTime + waktuMulai + durasi);
  } catch (e) {}
}
function bunyiBenar() { if (bacaPengaturan().efek) { nada(659,0.08,'sine',0); nada(880,0.12,'sine',0.07); } }
function bunyiSalah() { if (bacaPengaturan().efek) nada(180,0.18,'sawtooth',0); }
function bunyiSelesai() { if (bacaPengaturan().efek) { nada(523,0.1,'sine',0); nada(659,0.1,'sine',0.1); nada(784,0.2,'sine',0.2); } }

async function init() {
  const { data: sesi } = await sb.auth.getSession();
  if (!sesi.session) { window.location.href = 'index.html'; return; }
  const uid = sesi.session.user.id;
  uidSaya = uid;
  try {
    const { data: p, error } = await sb.from('profil').select('*, kelas(tingkat)').eq('id', uid).single();
    if (error) throw error;
    if (p.status !== 'approved' && p.role !== 'admin') {
      tampilkanPesan('Akun belum disetujui admin.');
      return;
    }
    tingkatSaya = (p.kelas ? p.kelas.tingkat : null) || 3;
    namaSaya = p.nama || 'Siswa';
  } catch (e) {
    tampilkanPesan('Gagal memuat profil: ' + (e.message || e));
  }
}

function tampilkanPesan(teks) {
  document.getElementById('view-intro').style.display = 'none';
  const el = document.getElementById('center-msg');
  el.style.display = 'block';
  el.textContent = teks;
}

function buatSoalRace() {
  let a, b, op, hasil;
  if (tingkatSaya <= 2) {
    op = Math.random() < 0.5 ? '+' : '-';
    if (op === '+') { a = acakInt(1, 15); b = acakInt(1, 15); hasil = a + b; }
    else { a = acakInt(5, 20); b = acakInt(1, a); hasil = a - b; }
  } else if (tingkatSaya <= 4) {
    const pilihan = ['+', '-', 'x'];
    op = pilihan[acakInt(0, 2)];
    if (op === '+') { a = acakInt(10, 100); b = acakInt(10, 100); hasil = a + b; }
    else if (op === '-') { a = acakInt(20, 150); b = acakInt(1, a); hasil = a - b; }
    else { a = acakInt(2, 12); b = acakInt(2, 12); hasil = a * b; }
  } else {
    const pilihan = ['+', '-', 'x', ':'];
    op = pilihan[acakInt(0, 3)];
    if (op === '+') { a = acakInt(50, 500); b = acakInt(50, 500); hasil = a + b; }
    else if (op === '-') { a = acakInt(100, 900); b = acakInt(1, a); hasil = a - b; }
    else if (op === 'x') { a = acakInt(3, 12); b = acakInt(3, 12); hasil = a * b; }
    else { b = acakInt(2, 12); hasil = acakInt(2, 12); a = b * hasil; }
  }
  const pertanyaan = `${a} ${op} ${b} = ...`;
  let opsiSet = new Set([hasil]);
  let percobaan = 0;
  const rentang = Math.max(3, Math.round(hasil * 0.2) || 5);
  while (opsiSet.size < 4 && percobaan < 30) {
    percobaan++;
    const delta = acakInt(-rentang, rentang);
    const kandidat = hasil + (delta === 0 ? 1 : delta);
    if (kandidat >= 0) opsiSet.add(kandidat);
  }
  const opsi = shuffle([...opsiSet]).map(String);
  return { pertanyaan, opsi, jawaban: String(hasil) };
}

function mulaiRace() {
  skorBenar = 0; skorSalah = 0; waktuSisa = DURASI_DETIK;
  document.getElementById('stat-benar').textContent = '0';
  document.getElementById('stat-salah').textContent = '0';
  document.getElementById('stat-waktu').textContent = String(DURASI_DETIK);
  document.getElementById('track-fill').style.width = '0%';
  document.getElementById('track-runner').style.left = '0%';
  tampilkanView('view-race');
  soalBerikutnya();
  clearInterval(timerRace);
  timerRace = setInterval(() => {
    waktuSisa--;
    document.getElementById('stat-waktu').textContent = String(waktuSisa);
    if (waktuSisa <= 0) selesaiRace();
  }, 1000);
}

function soalBerikutnya() {
  soalIni = buatSoalRace();
  document.getElementById('soal-teks').textContent = soalIni.pertanyaan;
  const opsiList = document.getElementById('opsi-list');
  opsiList.innerHTML = '';
  soalIni.opsi.forEach(teks => {
    const btn = document.createElement('button');
    btn.className = 'opsi-btn';
    btn.textContent = teks;
    btn.onclick = () => jawabRace(teks, btn);
    opsiList.appendChild(btn);
  });
}

function jawabRace(teks, btnEl) {
  const benar = teks === soalIni.jawaban;
  if (benar) {
    bunyiBenar();
    skorBenar++;
    document.getElementById('stat-benar').textContent = skorBenar;
    btnEl.classList.add('benar');
    const persen = Math.min(100, skorBenar * 4);
    document.getElementById('track-fill').style.width = persen + '%';
    document.getElementById('track-runner').style.left = persen + '%';
  } else {
    bunyiSalah();
    skorSalah++;
    document.getElementById('stat-salah').textContent = skorSalah;
    btnEl.classList.add('salah');
  }
  setTimeout(() => { if (waktuSisa > 0) soalBerikutnya(); }, 350);
}

function selesaiRace() {
  clearInterval(timerRace);
  bunyiSelesai();
  document.getElementById('hasil-skor').textContent = skorBenar + ' Benar';
  document.getElementById('hasil-detail').textContent = 'Salah: ' + skorSalah + ' — ' + komentarSkor(skorBenar);
  tampilkanView('view-hasil');
  simpanSkorRace();
}

async function simpanSkorRace() {
  if (!uidSaya) return;
  try {
    await sb.from('skor_game').insert({
      id_siswa: uidSaya, nama: namaSaya, mapel: 'matematika', tingkat: tingkatSaya,
      game: 'race-berhitung', nilai: skorBenar, waktu_detik: DURASI_DETIK
    });
  } catch (e) { console.warn('Gagal simpan skor race:', e); }
}

function komentarSkor(s) {
  if (s >= 25) return 'Luar biasa! Kamu juara balapan hitung! 🏆';
  if (s >= 15) return 'Keren, larimu cepat sekali! 🔥';
  if (s >= 8) return 'Bagus, terus berlatih ya! 💪';
  return 'Ayo coba lagi, kamu pasti bisa lebih cepat! 🙂';
}

init();
</script>
